[package]
name = "newskite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Desktop Usenet (NZB) download client"

[[bin]]
name = "newskite"
path = "src/main.rs"

[lib]
# The GUI lives in a library target so integration tests (snapshot rendering) can
# drive it without opening a window.
name = "newskite_app"
path = "src/lib.rs"

[dependencies]
newskite-types.workspace = true
newskite-service.workspace = true
newskite-theme.workspace = true
newskite-cli.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
tracing.workspace = true
thiserror.workspace = true
# egui 0.33 is the newest release whose MSRV (1.88) fits the workspace MSRV (1.89);
# 0.34+ need rustc 1.92/1.95.
eframe = { version = "0.33.3", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.33.3", default-features = false, features = ["svg"] }
clap = { version = "4.6", features = ["derive"] }
serde_json.workspace = true
chrono = { version = "0.4.41", default-features = false, features = ["clock", "std"] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }

[target.'cfg(unix)'.dependencies]
# statvfs for the free space on the download folder's filesystem (safe API).
rustix = { version = "1.1.2", default-features = false, features = ["fs", "std"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# Same winit as eframe; used only to pick its X11 backend (file drag and drop).
winit = { version = "0.30.13", default-features = false, features = ["x11"] }
notify-rust = { version = "4.11", default-features = false, features = ["z"] }
# File pickers, opening folders/files/pages: the XDG portal and FileManager1 over D-Bus
# (pure Rust, the same client the theme watcher uses); no helper programs.
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
# The platform dialogs and launchers where there is no D-Bus.
rfd = "0.17"
open = "5.3"

[dev-dependencies]
egui_kittest = { version = "0.33.3", features = ["wgpu", "snapshot"] }
tempfile = "3.27"
# Same resvg as egui_extras' svg loader; the icon tests rasterize with it directly.
resvg = { version = "0.45.1", default-features = false }
newskite-store.workspace = true
# Writes an unreadable settings row for the settings-notice test.
rusqlite = { version = "0.41.1", features = ["bundled"] }

# Debian package metadata for cargo-deb (`cargo deb -p newskite`). Asset sources are relative
# to this crate; `target/release/...` is rewritten by cargo-deb to the real target dir.
[package.metadata.deb]
name = "newskite"
maintainer = "Pat"
copyright = "2026, Pat"
# A machine-readable copyright file: the app's own license, the OFL fonts and the
# UnRAR library it embeds.
license-file = ["../../packaging/debian/copyright", "0"]
section = "net"
priority = "optional"
# $auto finds the libraries linked at build time (libc, libgcc, libstdc++ for the bundled
# UnRAR library). winit/glutin load the windowing libraries with dlopen, so those are
# listed explicitly.
depends = "$auto, libgl1, libegl1, libxkbcommon0, libwayland-client0, libwayland-cursor0, libwayland-egl1, libx11-6, libxcursor1, libxrandr2, libxi6, libxkbcommon-x11-0"
extended-description = """\
Newskite is a desktop Usenet (NZB) download client. It downloads the binary articles \
listed in an NZB file from an NNTP server over TLS, decodes them, writes the original \
files to disk, then verifies and repairs them with PAR2 and extracts RAR, 7z and ZIP \
archives (including split and spanned volumes and passwords) with built-in code; no \
external tools are needed. It keeps a resumable, reorderable queue with per-job \
pause and start, a download history and live throughput statistics, follows the desktop light or dark color scheme, and includes a \
headless command-line mode (newskite --headless) that drives the same queue engine. \
Server passwords are stored unencrypted in the local database."""
assets = [
    ["target/release/newskite", "usr/bin/", "755"],
    ["../../packaging/net.innerpulse.Newskite.desktop", "usr/share/applications/", "644"],
    ["../../packaging/net.innerpulse.Newskite.metainfo.xml", "usr/share/metainfo/", "644"],
    ["../../packaging/mime/newskite-nzb.xml", "usr/share/mime/packages/", "644"],
    ["../../packaging/icons/net.innerpulse.Newskite.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../packaging/icons/hicolor/16x16/apps/net.innerpulse.Newskite.png", "usr/share/icons/hicolor/16x16/apps/", "644"],
    ["../../packaging/icons/hicolor/24x24/apps/net.innerpulse.Newskite.png", "usr/share/icons/hicolor/24x24/apps/", "644"],
    ["../../packaging/icons/hicolor/32x32/apps/net.innerpulse.Newskite.png", "usr/share/icons/hicolor/32x32/apps/", "644"],
    ["../../packaging/icons/hicolor/48x48/apps/net.innerpulse.Newskite.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["../../packaging/icons/hicolor/64x64/apps/net.innerpulse.Newskite.png", "usr/share/icons/hicolor/64x64/apps/", "644"],
    ["../../packaging/icons/hicolor/128x128/apps/net.innerpulse.Newskite.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["../../packaging/icons/hicolor/256x256/apps/net.innerpulse.Newskite.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["../../packaging/icons/hicolor/512x512/apps/net.innerpulse.Newskite.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
    ["../../README.md", "usr/share/doc/newskite/", "644"],
    # The binary embeds Instrument Sans and JetBrains Mono (SIL OFL 1.1).
    ["../../assets/brand/fonts/OFL.txt", "usr/share/doc/newskite/fonts-OFL.txt", "644"],
]
