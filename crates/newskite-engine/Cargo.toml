[package]
name = "newskite-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Newskite download engine: concurrent NNTP segment fetch, yEnc decode and offset writes"

[dependencies]
newskite-types.workspace = true
newskite-nzb.workspace = true
newskite-nntp.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-util.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# fallocate for the in-progress output files (safe API).
rustix = { version = "1.1.2", default-features = false, features = ["fs", "std"] }

[dev-dependencies]
newskite-nntp = { workspace = true, features = ["testkit"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
sha2 = "0.10"
tempfile = "3.27"

[[bench]]
name = "throughput"
harness = false
